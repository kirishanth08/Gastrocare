<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadowEndo" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2F352B" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="680" height="480" rx="24" fill="#F7F2EB"/>
  
  <g transform="translate(40, 40)" filter="url(#shadowEndo)">
    <rect width="600" height="400" rx="20" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="600" height="60" rx="20" fill="#EAE2D6"/>
    <text x="30" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#2F352B">Endoscopy Procedure Flow &amp; Safety Standard</text>
    <rect x="460" y="16" width="110" height="28" rx="14" fill="#8B9A6E"/>
    <text x="472" y="34" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">CONSCIOUS SEDATION</text>

    <!-- 4 Procedural Steps -->
    <g transform="translate(30, 90)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="125" height="180" rx="14" fill="#F7F2EB" stroke="#EEEEEE"/>
      <circle cx="28" cy="28" r="14" fill="#8B9A6E"/>
      <text x="24" y="33" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
      <text x="14" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2F352B">Pre-Check</text>
      <text x="14" y="85" font-family="'Inter', sans-serif" font-size="10" fill="#66744E">Arrival 45m prior. Vitals intake, IV placement, and anaesthetist consultation.</text>
      <rect x="14" y="145" width="70" height="18" rx="9" fill="#EAE2D6"/>
      <text x="22" y="157" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#2F352B">45 MINS</text>

      <!-- Step 2 -->
      <rect x="135" y="0" width="125" height="180" rx="14" fill="#F7F2EB" stroke="#8B9A6E" stroke-width="1.5"/>
      <circle cx="163" cy="28" r="14" fill="#8B9A6E"/>
      <text x="158" y="33" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
      <text x="149" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2F352B">Gentle Sedation</text>
      <text x="149" y="85" font-family="'Inter', sans-serif" font-size="10" fill="#66744E">Administered by board-certified anesthesiologist for full comfort and zero pain.</text>
      <rect x="149" y="145" width="75" height="18" rx="9" fill="#8B9A6E" fill-opacity="0.2"/>
      <text x="156" y="157" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#8B9A6E">PROPOFOL</text>

      <!-- Step 3 -->
      <rect x="270" y="0" width="125" height="180" rx="14" fill="#F7F2EB" stroke="#EEEEEE"/>
      <circle cx="298" cy="28" r="14" fill="#66744E"/>
      <text x="293" y="33" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
      <text x="284" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2F352B">HD Procedure</text>
      <text x="284" y="85" font-family="'Inter', sans-serif" font-size="10" fill="#66744E">15–20 minutes duration. High-resolution mucosa inspection and targeted micro-biopsies.</text>
      <rect x="284" y="145" width="70" height="18" rx="9" fill="#EAE2D6"/>
      <text x="292" y="157" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#2F352B">15-20 MINS</text>

      <!-- Step 4 -->
      <rect x="405" y="0" width="135" height="180" rx="14" fill="#F7F2EB" stroke="#EEEEEE"/>
      <circle cx="433" cy="28" r="14" fill="#8B9A6E"/>
      <text x="428" y="33" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
      <text x="419" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2F352B">Recovery Lounge</text>
      <text x="419" y="85" font-family="'Inter', sans-serif" font-size="10" fill="#66744E">Rest in private suite for 30–45 mins. Doctor conducts preliminary result briefing.</text>
      <rect x="419" y="145" width="80" height="18" rx="9" fill="#8B9A6E" fill-opacity="0.2"/>
      <text x="427" y="157" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#8B9A6E">DOCTOR TALK</text>
    </g>

    <!-- Bottom Reassurance Panel -->
    <g transform="translate(30, 295)">
      <rect width="540" height="75" rx="14" fill="#F7F2EB" stroke="#8B9A6E" stroke-width="1"/>
      <circle cx="36" cy="37" r="16" fill="#8B9A6E"/>
      <path d="M 30 37 L 34 41 L 43 31" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="65" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2F352B">Patient Comfort &amp; Zero Recall Protocol</text>
      <text x="65" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#66744E">Over 98% of patients report feeling absolutely no discomfort during upper endoscopy and colonoscopy procedures at GastroCare.</text>
    </g>
  </g>
</svg>