<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Portal Sign In | GastroCare Gastroenterology &amp; Digestive Health</title>
  <meta name="description" content="Log in to your secure GastroCare patient portal to access upcoming endoscopy appointments, prep checklists, and lab results.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo/favicon.svg">
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('gastrocare-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
      const savedDir = localStorage.getItem('gastrocare-direction') || 'ltr';
      document.documentElement.setAttribute('dir', savedDir);
    })();
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="bg-body">

  <!-- Top Right Controls: Theme Mode & RTL Toggle -->
  <div class="gc-auth-top-controls">
    <button type="button" class="nav-control-btn theme-toggle-btn" aria-label="Toggle Dark Mode" title="Toggle Calm Clinical Night Mode">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    </button>

    <button type="button" class="rtl-toggle-btn" aria-label="Toggle LTR/RTL" title="Switch text direction">
      RTL
    </button>
  </div>

  <!-- Dedicated Minimal Auth Container -->
  <main class="gc-auth-standalone">
    <div class="gc-auth-card text-center">
      
      <!-- Brand Logo & Company Name at Top of Form (Redirects to Index) -->
      <a href="../index.html" class="d-inline-flex flex-column align-items-center text-decoration-none mb-3" aria-label="GastroCare Home">
        <img src="../assets/images/logo/gastrocare-logo-dark.svg" alt="GastroCare Clinic Logo" class="gc-brand-logo mb-1" style="height: 48px; max-width: 100%;">
      </a>

      <h1 class="h4 fw-bold mb-1">Sign In to Your Account</h1>
      <p class="small text-muted mb-4">Patient Care &amp; Clinical Records Portal</p>

      <!-- Google & Apple Social Login Methods -->
      <div class="d-flex flex-column gap-2 mb-3">
        <button type="button" id="googleLoginBtn" class="gc-btn-social" aria-label="Sign in with Google">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <button type="button" id="appleLoginBtn" class="gc-btn-social" aria-label="Sign in with Apple">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.35-.58.66-1.09 1.73-.95 2.76 1.01.08 2.05-.51 2.68-1.26z"/>
          </svg>
          <span>Continue with Apple</span>
        </button>
      </div>

      <div class="gc-auth-divider">
        <span>or sign in with email</span>
      </div>

      <!-- Login Form with Zero Redirection (Success Message Only) -->
      <form id="loginForm" class="text-start" novalidate>
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="loginEmail">Email Address</label>
          <input type="email" class="form-control" id="loginEmail" value="alex.patient@example.com" required autocomplete="email">
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label small fw-semibold mb-0" for="loginPassword">Password</label>
            <a href="forgot-password.html" class="small text-decoration-none">Forgot Password?</a>
          </div>
          <div class="input-group">
            <input type="password" id="loginPassword" class="form-control" value="DemoPass123!" required autocomplete="current-password">
            <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="loginPassword" aria-label="Toggle password visibility">&#128065;</button>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small text-muted" for="rememberMe">Remember my login on this device</label>
        </div>

        <button type="submit" id="submitLoginBtn" class="btn btn-lg btn-gc-primary w-100 py-2.5 fw-bold mb-3">Sign In</button>

        <div class="text-center">
          <span class="small text-muted">New to GastroCare? </span>
          <a href="register.html" class="small fw-bold text-decoration-none">Create Patient Account</a>
        </div>
      </form>

      <!-- Inline Success Notification (Zero Redirection) -->
      <div id="loginSuccessAlert" class="gc-login-success-box text-start mt-3 d-none" role="alert">
        <div class="d-flex align-items-start gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="flex-shrink-0 mt-0.5" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
          </svg>
          <div>
            <strong class="d-block" id="loginSuccessTitle">Login Successful!</strong>
            <span class="small" id="loginSuccessMessage">Welcome back, Alex Morgan. Your secure patient session is active. (Authenticated without redirection).</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loginForm = document.getElementById('loginForm');
      const alertBox = document.getElementById('loginSuccessAlert');
      const alertTitle = document.getElementById('loginSuccessTitle');
      const alertMessage = document.getElementById('loginSuccessMessage');
      const googleBtn = document.getElementById('googleLoginBtn');
      const appleBtn = document.getElementById('appleLoginBtn');

      function displayLoginSuccess(title, message) {
        if (alertTitle) alertTitle.textContent = title;
        if (alertMessage) alertMessage.textContent = message;
        if (alertBox) {
          alertBox.classList.remove('d-none');
          alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }

      // Standard Email Form Submission: ONLY show success message, NO redirection
      if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
          e.preventDefault();
          e.stopPropagation();
          displayLoginSuccess(
            '✓ Login Successful!',
            'Welcome back, Alex Morgan. Your session is now authenticated. (Demo mode - session active without redirection).'
          );
          return false;
        });
      }

      // Google Login Method: ONLY show success message, NO redirection
      if (googleBtn) {
        googleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          displayLoginSuccess(
            '✓ Google Sign-In Successful!',
            'Welcome back, Alex Morgan. Securely authenticated with alex.morgan@gmail.com. (Session active without redirection).'
          );
        });
      }

      // Apple Login Method: ONLY show success message, NO redirection
      if (appleBtn) {
        appleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          displayLoginSuccess(
            '✓ Apple Sign-In Successful!',
            'Welcome back, Alex Morgan. Securely authenticated with Apple ID. (Session active without redirection).'
          );
        });
      }

      // Password Visibility Toggle
      document.querySelectorAll('.toggle-password-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const targetId = this.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (input) {
            if (input.type === 'password') {
              input.type = 'text';
              this.innerHTML = '&#128064;';
            } else {
              input.type = 'password';
              this.innerHTML = '&#128065;';
            }
          }
        });
      });
    });
  </script>
</body>
</html>
