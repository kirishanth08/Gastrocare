<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76" fill="none">
  <defs>
    <linearGradient id="gcGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475C2F"/>
      <stop offset="100%" stop-color="#2D3A1E"/>
    </linearGradient>
    <linearGradient id="gcSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5DDD0"/>
      <stop offset="100%" stop-color="#F7F2EB"/>
    </linearGradient>
  </defs>
  <!-- Abstract digestive flow emblem -->
  <g transform="translate(6, 6)">
    <circle cx="32" cy="32" r="30" fill="url(#gcSoft)" stroke="#475C2F" stroke-width="2.5"/>
    <!-- Organic digestive flow path forming stylized G / flow -->
    <path d="M 22 20 C 34 16, 44 24, 40 33 C 36 42, 22 36, 25 44 C 27 49, 36 50, 42 45" 
          stroke="url(#gcGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="20" r="3.5" fill="#475C2F"/>
    <circle cx="42" cy="45" r="3.5" fill="#475C2F"/>
    <circle cx="33" cy="29" r="2.5" fill="#2D3A1E"/>
  </g>
  <!-- Wordmark -->
  <text x="78" y="38" font-family="'Plus Jakarta Sans', 'Manrope', 'Segoe UI', sans-serif" font-size="26" font-weight="900" letter-spacing="1.5" fill="#141913">GASTRO<tspan fill="#475C2F">CARE</tspan></text>
  <text x="79" y="55" font-family="'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" letter-spacing="2.8" fill="#2D3A1E">BETTER DIGESTION. BETTER LIVING.</text>
</svg>