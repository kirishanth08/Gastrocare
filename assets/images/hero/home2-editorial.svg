<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2F352B" flood-opacity="0.07"/>
    </filter>
  </defs>
  <!-- Architectural asymmetrical block layout -->
  <rect x="40" y="40" width="440" height="460" rx="24" fill="#EAE2D6"/>
  <rect x="180" y="80" width="460" height="420" rx="24" fill="#FFFFFF" filter="url(#shadow2)"/>
  
  <!-- Olive Accent Vertical Strip -->
  <rect x="180" y="80" width="8" height="420" fill="#8B9A6E"/>
  
  <!-- Editorial Headline inside graphic -->
  <text x="210" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8B9A6E">CLINICAL EDITORIAL ARCHIVE #04</text>
  <text x="210" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#2F352B">Precision Gastro Diagnostics</text>
  <text x="210" y="190" font-family="'Inter', sans-serif" font-size="12" fill="#66744E">Evidence-based endoscopy, mucosal evaluation, and IBS care.</text>
  
  <!-- 3 Pillar Diagnostic Diagram -->
  <g transform="translate(210, 220)">
    <!-- Column 1 -->
    <rect x="0" y="0" width="125" height="150" rx="14" fill="#F7F2EB" stroke="#EEEEEE"/>
    <circle cx="28" cy="30" r="14" fill="#8B9A6E"/>
    <text x="22" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF">01</text>
    <text x="14" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2F352B">Endoscopy</text>
    <text x="14" y="88" font-family="'Inter', sans-serif" font-size="10" fill="#66744E">HD Upper GI &amp; colon examination with sedation safety.</text>
    <rect x="14" y="122" width="60" height="16" rx="8" fill="#8B9A6E" fill-opacity="0.2"/>
    <text x="20" y="133" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#8B9A6E">HD VIDEO</text>

    <!-- Column 2 -->
    <rect x="135" y="0" width="125" height="150" rx="14" fill="#F7F2EB" stroke="#EEEEEE"/>
    <circle cx="163" cy="30" r="14" fill="#66744E"/>
    <text x="157" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF">02</text>
    <text x="149" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2F352B">Motility Lab</text>
    <text x="149" y="88" font-family="'Inter', sans-serif" font-size="10" fill="#66744E">Esophageal manometry &amp; hydrogen breath testing.</text>
    <rect x="149" y="122" width="65" height="16" rx="8" fill="#EAE2D6"/>
    <text x="155" y="133" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#2F352B">LAB ACCRED</text>

    <!-- Column 3 -->
    <rect x="270" y="0" width="125" height="150" rx="14" fill="#F7F2EB" stroke="#8B9A6E" stroke-width="1.5"/>
    <circle cx="298" cy="30" r="14" fill="#8B9A6E"/>
    <text x="292" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF">03</text>
    <text x="284" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2F352B">IBS Pathways</text>
    <text x="284" y="88" font-family="'Inter', sans-serif" font-size="10" fill="#66744E">Multidisciplinary gut wellness &amp; low-FODMAP guidance.</text>
    <rect x="284" y="122" width="60" height="16" rx="8" fill="#8B9A6E" fill-opacity="0.2"/>
    <text x="290" y="133" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#8B9A6E">WELLNESS</text>
  </g>

  <!-- Bottom Editorial Quote -->
  <g transform="translate(210, 400)">
    <rect x="0" y="0" width="395" height="70" rx="12" fill="#F7F2EB"/>
    <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-style="italic" font-weight="600" fill="#2F352B">"Modern gastro care bridges scientific pathology and compassionate patient reassurance."</text>
    <text x="20" y="52" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#8B9A6E">— Board of Gastroenterology Specialists, GastroCare</text>
  </g>
</svg>