<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="100%" height="100%" fill="none">
  <rect width="680" height="460" rx="24" fill="#EAE2D6"/>
  <g transform="translate(40, 30)">
    <rect width="600" height="400" rx="20" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
    <rect width="600" height="60" rx="20" fill="#F7F2EB"/>
    <text x="30" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#2F352B">Clinical Service Directory &amp; Diagnostic Tiers</text>
    
    <!-- Visual Representation of Diagnostic Pathway -->
    <g transform="translate(30, 90)">
      <circle cx="50" cy="50" r="40" fill="#8B9A6E" fill-opacity="0.15"/>
      <circle cx="50" cy="50" r="28" fill="#8B9A6E"/>
      <text x="42" y="56" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF">&#128300;</text>
      <text x="110" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#2F352B">Diagnostic Endoscopy &amp; Colonoscopy</text>
      <text x="110" y="58" font-family="'Inter', sans-serif" font-size="12" fill="#66744E">High-definition mucosal inspection, polypectomy, Barrett's esophagus surveillance, and celiac biopsies.</text>
    </g>

    <line x1="30" y1="180" x2="570" y2="180" stroke="#EEEEEE" stroke-width="1.5"/>

    <g transform="translate(30, 200)">
      <circle cx="50" cy="50" r="40" fill="#8B9A6E" fill-opacity="0.15"/>
      <circle cx="50" cy="50" r="28" fill="#66744E"/>
      <text x="43" y="55" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF">&#9879;</text>
      <text x="110" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#2F352B">IBS &amp; Functional Gut Disorders</text>
      <text x="110" y="58" font-family="'Inter', sans-serif" font-size="12" fill="#66744E">Targeted therapy for visceral hypersensitivity, motility dysregulation, and SIBO with combined clinical &amp; dietary support.</text>
    </g>

    <line x1="30" y1="290" x2="570" y2="290" stroke="#EEEEEE" stroke-width="1.5"/>

    <g transform="translate(30, 310)">
      <circle cx="50" cy="50" r="40" fill="#8B9A6E" fill-opacity="0.15"/>
      <circle cx="50" cy="50" r="28" fill="#8B9A6E"/>
      <text x="44" y="56" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF">&#128138;</text>
      <text x="110" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#2F352B">Liver, Gallbladder &amp; Pancreatic Care</text>
      <text x="110" y="58" font-family="'Inter', sans-serif" font-size="12" fill="#66744E">Advanced liver elastography, fatty liver staging, viral hepatitis treatment, and biliary evaluations.</text>
